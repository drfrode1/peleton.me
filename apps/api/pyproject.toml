[project]
name = "peleton-api"
version = "0.1.0"
description = "FastAPI backend for peleton.me"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic[email]",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tells hatchling to include files sitting in root directory
[tool.hatch.build.targets.wheel]
packages = ["peleton_api"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff.lint]
ignore = ["B008"]