settings:
  default_history_days: 90

locations:
  - id: "forus"
    name: "Forus Industrial Park"
    coordinates:
      lat: 58.8913
      lon: 5.7276
    sources:
      met_frost:
        enabled: true
        element_ids:
          - "air_temperature"
          - "sum(precipitation_amount PT1H)"
          - "wind_speed"
      
      travel_times:
        enabled: true
        section_ids:
          - "100357"  # Example DATEX II Predefined Location Reference ID for travel time
          - "100356"

      traffic_volumes:
        enabled: true
        trp_ids:
          - "13433V319582" # Example Traffic Registration Point ID for car/bicycle counting

  - id: "algard"
    name: "Ålgård Center"
    coordinates:
      lat: 58.7621
      lon: 5.8525
    sources:
      met_frost:
        enabled: true
        element_ids:
          - "air_temperature"
          - "sum(precipitation_amount PT1H)"
      
      travel_times:
        enabled: false
        section_ids: []

      traffic_volumes:
        enabled: true
        trp_ids:
          - "44656V72812"