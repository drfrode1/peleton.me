[project]
name = "peleton-data-pipeline"
version = "0.1.0"
description = "Dagster orchestration and MotherDuck data pipeline for peleton.me"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.30.0",
    "dagster>=1.8.0",
    "dagster-webserver>=1.8.0",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline"]

[tool.dagster]
module_name = "data_pipeline"